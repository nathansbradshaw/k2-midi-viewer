<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" role="img" aria-labelledby="title desc">
  <title id="title">Dark rocker switch — off state</title>
  <desc id="desc">A label-free beveled rocker with its top edge raised.</desc>
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#565855"/>
      <stop offset=".16" stop-color="#30322f"/>
      <stop offset=".62" stop-color="#171816"/>
      <stop offset="1" stop-color="#070807"/>
    </linearGradient>
    <linearGradient id="well" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#050605"/>
      <stop offset=".45" stop-color="#121310"/>
      <stop offset="1" stop-color="#2c2d29"/>
    </linearGradient>
    <linearGradient id="rocker" x1=".18" y1="0" x2=".78" y2="1">
      <stop stop-color="#525451"/>
      <stop offset=".12" stop-color="#3a3c39"/>
      <stop offset=".58" stop-color="#232421"/>
      <stop offset="1" stop-color="#0b0c0b"/>
    </linearGradient>
    <linearGradient id="tilt" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#777974" stop-opacity=".48"/>
      <stop offset=".27" stop-color="#393b38" stop-opacity=".12"/>
      <stop offset=".58" stop-color="#0b0c0b" stop-opacity=".24"/>
      <stop offset="1" stop-color="#000" stop-opacity=".72"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-20%" width="150%" height="155%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".58"/>
    </filter>
    <filter id="grain" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="17" result="noise"/>
      <feComposite in="noise" in2="SourceGraphic" operator="in" result="texture"/>
      <feBlend in="SourceGraphic" in2="texture" mode="soft-light"/>
    </filter>
  </defs>
  <rect x="21" y="13" width="198" height="294" rx="22" fill="url(#bezel)" filter="url(#shadow)"/>
  <rect x="29" y="21" width="182" height="278" rx="17" fill="none" stroke="#757771" stroke-opacity=".34" stroke-width="2"/>
  <rect x="45" y="42" width="150" height="236" rx="16" fill="url(#well)"/>
  <path d="M57 63Q57 51 70 48H170Q183 51 183 64L177 246Q176 261 163 265H76Q64 262 63 249Z" fill="url(#rocker)" filter="url(#grain)"/>
  <path d="M57 63Q57 51 70 48H170Q183 51 183 64L177 246Q176 261 163 265H76Q64 262 63 249Z" fill="url(#tilt)"/>
  <path d="M67 73Q68 60 79 58H161Q173 60 174 73" fill="none" stroke="#afb1ab" stroke-opacity=".30" stroke-width="3" stroke-linecap="round"/>
  <path d="M65 231Q89 241 120 241T176 231L177 246Q176 259 163 263H77Q65 260 64 248Z" fill="#060706" fill-opacity=".56"/>
</svg>
