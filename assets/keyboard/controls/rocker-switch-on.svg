<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" role="img" aria-labelledby="title desc">
  <title id="title">Dark rocker switch — on state</title>
  <desc id="desc">A label-free beveled rocker with its lower edge raised.</desc>
  <defs>
    <linearGradient id="bezel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#565855"/>
      <stop offset=".16" stop-color="#30322f"/>
      <stop offset=".62" stop-color="#171816"/>
      <stop offset="1" stop-color="#070807"/>
    </linearGradient>
    <linearGradient id="well" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#292a27"/>
      <stop offset=".55" stop-color="#111210"/>
      <stop offset="1" stop-color="#040504"/>
    </linearGradient>
    <linearGradient id="rocker" x1=".16" y1="0" x2=".82" y2="1">
      <stop stop-color="#262825"/>
      <stop offset=".5" stop-color="#30322f"/>
      <stop offset=".86" stop-color="#424440"/>
      <stop offset="1" stop-color="#1a1b19"/>
    </linearGradient>
    <linearGradient id="tilt" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#000" stop-opacity=".62"/>
      <stop offset=".28" stop-color="#0c0d0c" stop-opacity=".28"/>
      <stop offset=".72" stop-color="#565853" stop-opacity=".08"/>
      <stop offset="1" stop-color="#a6a9a2" stop-opacity=".38"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-20%" width="150%" height="155%">
      <feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#000" flood-opacity=".58"/>
    </filter>
    <filter id="grain" x="-8%" y="-8%" width="116%" height="116%">
      <feTurbulence type="fractalNoise" baseFrequency=".85" numOctaves="2" seed="17" result="noise"/>
      <feComposite in="noise" in2="SourceGraphic" operator="in" result="texture"/>
      <feBlend in="SourceGraphic" in2="texture" mode="soft-light"/>
    </filter>
  </defs>
  <rect x="21" y="13" width="198" height="294" rx="22" fill="url(#bezel)" filter="url(#shadow)"/>
  <rect x="29" y="21" width="182" height="278" rx="17" fill="none" stroke="#757771" stroke-opacity=".34" stroke-width="2"/>
  <rect x="45" y="42" width="150" height="236" rx="16" fill="url(#well)"/>
  <path d="M63 71Q64 58 77 55H163Q176 58 177 72L183 250Q183 263 170 268H70Q57 264 57 251Z" fill="url(#rocker)" filter="url(#grain)"/>
  <path d="M63 71Q64 58 77 55H163Q176 58 177 72L183 250Q183 263 170 268H70Q57 264 57 251Z" fill="url(#tilt)"/>
  <path d="M64 73Q90 64 120 64T176 73" fill="none" stroke="#000" stroke-opacity=".48" stroke-width="7" stroke-linecap="round"/>
  <path d="M68 246Q69 258 80 260H160Q172 258 173 245" fill="none" stroke="#afb1ab" stroke-opacity=".30" stroke-width="3" stroke-linecap="round"/>
</svg>
