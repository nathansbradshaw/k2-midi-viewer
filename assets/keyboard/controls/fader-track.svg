<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 112" preserveAspectRatio="none" role="img" aria-labelledby="title desc">
  <title id="title">Horizontal recessed fader track</title>
  <desc id="desc">A transparent hardware fader bed with a deep slot, subtle printed scale ticks, and three major marks.</desc>
