  <rect x="32" y="48" width="576" height="16" rx="7" fill="url(#slot)" stroke="#000" stroke-opacity=".9" vector-effect="non-scaling-stroke"/>
  <path d="M39 50H601" fill="none" stroke="#c2c4b8" stroke-opacity=".11" stroke-linecap="round" vector-effect="non-scaling-stroke"/>
