    <linearGradient id="slot-rim" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#020302"/>
      <stop offset=".42" stop-color="#11130f"/>
      <stop offset="1" stop-color="#44463f"/>
    </linearGradient>
    <linearGradient id="slot" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#000"/>
      <stop offset=".54" stop-color="#070806"/>
      <stop offset="1" stop-color="#1b1d18"/>
    </linearGradient>
  </defs>
  <g fill="none" stroke-linecap="round" vector-effect="non-scaling-stroke">
