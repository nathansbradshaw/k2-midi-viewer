<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 104" preserveAspectRatio="none" role="img" aria-labelledby="title desc">
  <title id="title">Dark recessed label plate</title>
  <desc id="desc">An empty understated equipment label well.</desc>
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#11130f"/>
      <stop offset=".55" stop-color="#1b1d18"/>
      <stop offset="1" stop-color="#242720"/>
    </linearGradient>
    <filter id="inset" x="-3%" y="-20%" width="106%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000" flood-opacity=".72"/>
    </filter>
  </defs>
  <rect x="7" y="8" width="586" height="88" rx="7" fill="#050604" filter="url(#inset)"/>
  <rect x="11" y="12" width="578" height="80" rx="5" fill="url(#plate)" stroke="#4b4d43" stroke-opacity=".38"/>
  <path d="M18 18H582" stroke="#74766b" stroke-opacity=".16"/>
</svg>
