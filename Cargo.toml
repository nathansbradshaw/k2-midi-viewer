[package]
name = "k2-midi-viewer"
version = "0.1.0"
edition = "2024"

[dependencies]
iced       = { version = "0.14", default-features = false, features = ["advanced", "canvas", "crisp", "fira-sans", "image-without-codecs", "svg", "tokio"] }
image      = { version = "0.25", default-features = false, features = ["png", "webp"] }
midly      = "0.5"
rfd        = "0.17"

[build-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }
webp = { version = "0.3.1", default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
iced       = { version = "0.14", default-features = false, features = ["wgpu"] }
cpal       = "0.15"
midir      = "0.11"
spin_sleep = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
iced = { version = "0.14", default-features = false, features = ["wgpu", "webgl", "web-colors"] }
console_error_panic_hook = "0.1"
cpal = { version = "0.15", features = ["wasm-bindgen"] }
web-time = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window", "Navigator", "Location", "History",
    "MidiAccess", "MidiInput", "MidiInputMap", "MidiMessageEvent",
    "MidiOptions", "MidiOutput", "MidiOutputMap", "MidiPort", "MidiPortDeviceState",
] }
